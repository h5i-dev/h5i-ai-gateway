version: h5i.test/v1
id: budget
name: A call the key's budget cannot cover is refused and charges nothing (Theorems.budget_never_exceeded)

requests:
  mint:
    method: POST
    path: /key/generate
    headers: {authorization: "Bearer ${env.LITELLM_MASTER_KEY}", content-type: application/json}
    json: {models: [gpt-4o-mini], max_budget: 0.000001}
  chat:
    method: POST
    path: /v1/chat/completions
    headers: {authorization: "Bearer ${key}", content-type: application/json}
    json: {model: gpt-4o-mini, messages: [{role: user, content: hi}]}
  info:
    path: /key/info
    headers: {authorization: "Bearer ${key}"}

flow:
  - send: mint
    extract: {key: "json:key"}
  - send: chat
    expect:
      all:
        - status: 400
        - body: budget_exceeded
  - send: info
    expect:
      all:
        - status: 200
        - body: '"spend":0.0'
        - body: '"reserved_spend":0.0'
