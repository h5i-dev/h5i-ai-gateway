[package]
name = "gateway-providers"
description = "LLM provider adapters for h5i-ai-gateway: OpenAI-compatible request/response types and translation to each provider"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
# SHA-256 / HMAC for SigV4 and RS256 for Google service-account JWTs; already
# linked as rustls' crypto provider, so this adds no new code to the build.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = "0.22"
bytes = "1.12"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.54", features = ["time", "sync"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "time"] }
