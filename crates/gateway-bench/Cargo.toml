[package]
name = "gateway-bench"
description = "Benchmark tools for h5i-ai-gateway: a mock OpenAI-compatible upstream and an HTTP load generator"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "mock-upstream"
path = "src/bin/mock_upstream.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[dependencies]
axum = "0.8"
bytes = "1"
futures = "0.3"
hdrhistogram = { version = "7.5", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "sync"] }
