<text class="tick" x="644.8" y="226" text-anchor="middle">9000</text>
<text class="label" x="460.0" y="240" text-anchor="middle">CPU microseconds per request</text>
<g><title>h5i-gateway: 180 CPU microseconds per request</title><path d="M250,70 H257.89638604554 Q257.89638604554,70 257.89638604554,70 V90 Q257.89638604554,90 257.89638604554,90 H250 Z" style="fill:var(--series-1)"/></g>
<text class="legend" x="240" y="84.0" text-anchor="end">h5i-gateway</text>
