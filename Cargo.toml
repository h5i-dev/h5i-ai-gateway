[workspace]
resolver = "3"
members = ["kernel"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
repository = "https://github.com/koukyosyumei/h5i-ai-gateway"

[workspace.dependencies]
# h5i-app from crates.io, pinned to 0.1.3.
h5i-app = { version = "=0.1.3" }
h5i-app-core = { version = "=0.1.3" }
h5i-app-http = { version = "=0.1.3" }
h5i-app-pg = { version = "=0.1.3" }
h5i-app-json = { version = "=0.1.3" }
h5i-app-schema = { version = "=0.1.3" }
h5i-app-sql = { version = "=0.1.3" }
h5i-app-std = { version = "=0.1.3" }
gateway-kernel = { path = "kernel" }
